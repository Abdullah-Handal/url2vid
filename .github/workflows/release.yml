name: Build desktop app

# Tag a release to publish installers:  git tag v0.1.0 && git push --tags
# Pull requests run the same build and smoke tests, but publish nothing.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: url2vid-linux-x86_64.tar.gz
          - os: windows-latest
            artifact: url2vid-windows-setup.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # pywebview's GTK backend needs the WebKit introspection data. Without
      # it PyInstaller cannot collect the typelib and the packaged app falls
      # back to opening a browser instead of its own window.
      - name: Install GTK/WebKit (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # PyGObject has no cp314 wheel, so pip builds it from source and
          # needs the cairo and girepository headers to do that.
          # xvfb gives the smoke test a display to open the real window on.
          # gir1.2-girepository-3.0: without it PyInstaller cannot query the
          # GI modules ("Namespace GIRepository not available"), skips their
          # typelibs and gi.overrides, and the frozen app's GTK backend breaks
          # (GLib.idle_add raises, so the page's bridge never loads).
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
                                  gir1.2-girepository-3.0 \
                                  pkg-config libcairo2-dev python3-dev xvfb
          # The girepository dev package was renamed; accept either.
          sudo apt-get install -y libgirepository-2.0-dev \
            || sudo apt-get install -y libgirepository1.0-dev

      - name: Build the web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Pinned to the versions that built and passed the smoke test, so a
          # new release of any of them cannot silently change what ships.
          pip install pyinstaller==6.22.0 pywebview==6.2.1
          if [ "$RUNNER_OS" = "Linux" ]; then pip install PyGObject==3.56.3; fi
          # pywebview's Windows backend is WinForms, which is reached through
          # pythonnet. Installing pywebview alone builds an app that cannot
          # open a window at all.
          if [ "$RUNNER_OS" = "Windows" ]; then pip install pythonnet==3.1.0; fi
        shell: bash

      # The suite covers what packaging changes about the app, so it runs
      # before anything is built rather than after something ships broken.
      - name: Run the test suite
        run: python -m pytest -q
        shell: bash

      - name: Fetch static ffmpeg
        run: python scripts/fetch_ffmpeg.py

      - name: Package
        run: pyinstaller url2vid.spec --noconfirm --log-level WARN

      # Serves, resolves a URL, converts a local clip to MP3 with the bundled
      # ffmpeg, and opens the real window until the UI has rendered in it.
      - name: Smoke test the bundle
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python scripts/smoke_test.py --window
          else
            python scripts/smoke_test.py --window
          fi
        shell: bash

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.artifact }} -C dist url2vid

      # A single setup .exe rather than a zip: it lands the folder somewhere
      # sensible, makes the shortcuts, and registers an uninstaller.
      - name: Build the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Only a tag is a version; a branch or PR ref ("12/merge") is not.
          $version = "0.0.0"
          if ("${{ github.ref_type }}" -eq "tag") { $version = "${{ github.ref_name }}" -replace '^v','' }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$version" packaging\url2vid.iss
          Copy-Item installer\url2vid-windows-setup.exe url2vid-windows-setup.exe

      # Installs the way a user would (silently, no admin), smoke tests the
      # installed copy, then checks the uninstaller removes it.
      - name: Smoke test the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "url2vid-installed"
          $setup = Start-Process .\url2vid-windows-setup.exe -Wait -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`""
          if ($setup.ExitCode -ne 0) { throw "installer exited with $($setup.ExitCode)" }
          python scripts/smoke_test.py "$dir\url2vid.exe"
          if ($LASTEXITCODE -ne 0) { throw "the installed app failed its smoke test" }
          $remove = Start-Process "$dir\unins000.exe" -Wait -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          if ($remove.ExitCode -ne 0) { throw "uninstaller exited with $($remove.ExitCode)" }

      # Also a no-install single file, for a USB stick. It unpacks itself on
      # every launch, so it starts noticeably slower than the installed copy.
      - name: Build the portable exe (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          URL2VID_ONEFILE: "1"
        run: |
          pyinstaller url2vid.spec --noconfirm --log-level WARN --distpath dist-onefile
          cp dist-onefile/url2vid.exe url2vid-windows-portable.exe

      - name: Smoke test the portable exe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/smoke_test.py (Resolve-Path url2vid-windows-portable.exe).Path
          if ($LASTEXITCODE -ne 0) { throw "the portable exe failed its smoke test" }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Globs, so the patterns that belong to the other platform simply
          # match nothing instead of failing the step.
          path: |
            url2vid-linux-*.tar.gz
            url2vid-windows-*.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            url2vid-linux-*.tar.gz
            url2vid-windows-*.exe
